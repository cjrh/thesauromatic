[package]
name = "thesauromatic"
version = "0.0.11"
edition = "2018"
license = "AGPL-3.0"
description = """
thesauromatic is a command-line thesaurus that returns
related words when given a word. The output words are
one per line, making it easy to process in shell
pipelines.
"""
homepage = "https://github.com/cjrh/thesauromatic"
documentation = "https://github.com/cjrh/thesauromatic"
repository = "https://github.com/cjrh/thesauromatic"
readme = "README.md"
keywords = ["thesaurus", "synonyms", "nlp", "natural-language"]
categories = [
    "text-processing",
]
exclude = [
    "google-books-common-words-lower.csv",
    "words.txt"
]

[badges]
maintenance = { status = "passively-maintained" }

# cargo-binstall metadata: tells `cargo binstall thesauromatic` where to find the
# prebuilt binaries produced by the Release workflow. The URL/layout matches what
# taiki-e/upload-rust-binary-action emits: an asset named `{name}-{target}.{ext}`
# attached to the `v{version}` GitHub Release, with the binary at the archive root.
# `pkg-fmt` is intentionally omitted so binstall accepts both .tar.gz (unix) and
# .zip (Windows).
[package.metadata.binstall]
pkg-url = "{repo}/releases/download/v{version}/{name}-{target}{archive-suffix}"
bin-dir = "{bin}{binary-ext}"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
phf = "0.11"

[build-dependencies]
phf_codegen = "0.11"

# Optimize the release binary for fast startup and small size. The bulk of the
# binary is the embedded word table (read-only data), but LTO + a single
# codegen unit shrink the code, `panic = "abort"` drops unwinding tables, and
# `strip` removes symbols — all of which reduce what the loader maps at launch.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
